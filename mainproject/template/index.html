<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    
    <header class="bg-[#6a3971] shadow-sm sticky top-0 z-50">

                <div class="shrink-0 flex flex-col">
                    <a href="#" class="group">

                            SOLE<span class="text-[#fdf0ff] group-hover:text-gray-900">VAULT</span>
                        </h1>
                        <p class="text-[10px] uppercase tracking-widest text-gray-500 -mt-1 font-semibold">
                            Style From the Ground Up
                        </p>
                    </a>
                </div>

                <div class="hidden md:block">
                    <ul class="flex space-x-8">
                        <li>
                            <a href="#" class="text-sm font-bold uppercase tracking-wide text-white hover:text-black hover:bg-[#fdf0ff] hover:rounded-2xl p-2 transition-colors">Home</a>
                        </li>
                        <li>
                            <a href="#" class="text-sm font-bold uppercase tracking-wide text-white hover:text-black hover:bg-[#fdf0ff] hover:rounded-2xl p-2 transition-colors">About</a>
                        </li>
                        <li>
                            <a href="#" class="text-sm font-bold uppercase tracking-wide text-white hover:text-black hover:bg-[#fdf0ff] hover:rounded-2xl p-2 transition-colors">Shop</a>

                <div class="flex items-center space-x-5">
                    <button class="text-gray-600 hover:text-orange-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                        </svg>
                    </button>

<section class="h-screen w-full relative bg-[#dd00ff] flex justify-center items-center flex-col overflow-hidden">

    <div class="md:-translate-y-[7vw] md:left-[10vw] md:top-58 z-0 m-2 p-2">
        <h1 class="text-[30vw] md:text-[28vw] font-[MangoGrotesque] font-bold">
            Step into style
        </h1> 
    </div>

    <div class="-translate-y-[4vw] sm:left-[10vw] z-0 m-2 p-2">
        <h2 class="text-6xl text-bold font-[MangoGrotesque] m-2 p-2" id="hero-split">
            Premium sneakers for the modern athlete
        </h2>
    </div>


    <div class="absolute inset-0 flex justify-center items-center pointer-events-none">
        <div class="bg-[url('../image/Shoe-1.png')] z-10 md:w-[45vw] md:h-[45vw] bg-contain bg-center bg-no-repeat" id="left">
        </div>
    </div>
   

    <div class="absolute bottom-10 left-10 max-w-xs z-20 -translate-y-20" id="hero-split">
        <p class="text-lg text-white font-medium ">
        Designed for ultimate comfort and high-performance athletes. 
        Experience the revolution of the sole.
        </p>
    <button class="mt-4 px-6 py-2 bg-black text-white rounded-full">Shop Now</button>
  </div>

</section>

<section class="relative h-screen">
    
    
    <div id='main-content' class="h-screen w-full absolute z-0">
        <div class="grid grid-cols-2 grid-rows-3 gap-2 m-4">
            <div class="bg-amber-300 col-span-2 row-span-2 h-96 rounded-2xl  mt-4"><h1>1</h1></div>
            <div class="bg-amber-300  h-48 rounded-2xl"><h1>2</h1></div>
            <div class="bg-amber-300  h-48 rounded-2xl"><h1>3</h1></div>
            <div class="bg-amber-300 h-[4vw] w-full"></div>
            <div class="bg-amber-300 h-[4vw] w-full"></div>
        </div>
    </div>

    
    <div id="box" class="bg-[#dd00ff] h-screen w-full absolute top-0 left-0  flex justify-center items-center">
        <div>
            <h1 class="md:text-[40vw] text-9xl font-bold text-[#fdf0ff] font-[MangoGrotesque]" id="split">
                New Arrival
            </h1>
        </div>
    </div>

</section>

<section>

    <div class="bg-[#000000] h-screen w-full"></div>
</section>

    
    
    
    
    <script src="/mainproject/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/SplitText.min.js"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(SplitText);

            let split2 = new SplitText("#hero-split", {
                type: "lines words",
                wordsClass: "words"
            });

            gsap.from(split2.lines, {
                scale: 0,
                duration: 1.2,
                y: 100,
                opacity: 0,
                stagger: 0.1,
                ease: "power2.out"
            });
        });
    </script>

    <script>

        gsap.from("left", {
            duration: 3,
            x: -100,
            ease: "power3.out",
            opacity: 0
            
        })

    </script>

    <script>

        

        gsap.registerPlugin(ScrollTrigger,SplitText);

        let split = SplitText.create("#split", { type: "words, chars" });


        gsap.from(split.chars, { 
            scale: 0,
            y: 100,
            autoAlpha: 0,
            stagger: 0.05,
            duration: 1,
            ease: "power2.out",
            scrollTrigger: {
                trigger: "#split",
                start: "top 80%", // starts when element enters viewport
                end: "top 60%",   // ends animation here
                scrub: 1,         // smooth scrub
                markers: false,
                // Remove pin: true - you don't need it for text reveal
            }
        });

        const gp = gsap.timeline({
            scrollTrigger: {
                trigger: "#box",
                start: "top 60",
                end: "top 40%",
                pin: true,
                scrub: true,
                markers: false
            }
        });

        gp.to("#box", { opacity: 0, y: 200, duration:2});



    </script>

</body>
</html>
